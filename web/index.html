<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baranguard</title>
  <!-- Theme bootstrap — MUST run before any stylesheet paints, which is
       why it's inline and first, not in main.js (a module script, which
       is deferred by spec and would run after first paint, producing a
       visible flash of the wrong theme on every load for a user who has
       chosen dark). Mirrors AppShell.js's own read of the same
       localStorage key — see that file for where the value is written.
       §1.1/§7.1 of the UI/UX review. -->
  <script>
    (function () {
      // 2026-09-06 UI/UX audit fix. This block used to set data-theme ONLY
      // when localStorage held an explicit choice, leaving the attribute
      // absent for anyone who had never touched the toggle. base.css copes
      // with that (its dark block is `@media (prefers-color-scheme: dark)
      // { :root:not([data-theme="light"]) }`), but the 28 dark-mode rules
      // in the PAGE stylesheets are all written as `[data-theme="dark"] .x`
      // with no media-query twin — so a first-time visitor on an OS-dark
      // machine got dark tokens with light-mode component overrides still
      // applied: unreadable SMS tag pills, light blotter table headers,
      // light GIS panels floating over the dark map, dark-on-dark select
      // chevrons.
      //
      // Fixed by always stamping a RESOLVED theme, so `[data-theme="dark"]`
      // is a complete description of the current state and page CSS needs
      // no duplicated media-query copy of every rule. Neither the toggle
      // (AppShell.js) nor Settings offers a third "system" state, so this
      // matches what the UI already presents. The attribute is still only
      // *persisted* on an explicit choice — an unstored resolve keeps
      // tracking the OS, including live changes (listener below).
      try {
        var stored = localStorage.getItem('baranguard.theme');
        var explicit = stored === 'light' || stored === 'dark';
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        document.documentElement.setAttribute(
          'data-theme',
          explicit ? stored : (mq && mq.matches ? 'dark' : 'light')
        );
        if (!explicit && mq && mq.addEventListener) {
          mq.addEventListener('change', function (e) {
            // Stop following the OS the moment a real preference is stored.
            var now = null;
            try { now = localStorage.getItem('baranguard.theme'); } catch (err) { /* ignore */ }
            if (now === 'light' || now === 'dark') return;
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
          });
        }
      } catch (e) {
        /* private mode / storage disabled — fall back to the OS preference
           directly rather than leaving the attribute unset, which is the
           exact state that stranded the page-level rules. */
        try {
          var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          document.documentElement.setAttribute('data-theme', m && m.matches ? 'dark' : 'light');
        } catch (e2) { document.documentElement.setAttribute('data-theme', 'light'); }
      }
    })();
  </script>
  <!-- Branded favicon: a navy shield, matching icons.js's own `shield`
       glyph — an inline SVG data URI so no separate binary asset/build
       step is needed, consistent with icons.js's own "no external icon
       library" approach (§1: no bundler). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231E3A6E'%3E%3Cpath d='M12 2l8 3.5v6.5c0 5.6-3.8 9.4-8 10.7-4.2-1.3-8-5.1-8-10.7V5.5z'/%3E%3C/svg%3E">
  <!-- §7.2 of the UI/UX review — same navy shield as the favicon above, no
       separate binary asset (consistent with §1's "no bundler, no asset
       pipeline" stance). Honest limitation, not hidden: an SVG apple-
       touch-icon has patchier iOS Safari support than a PNG would, but
       this is a locally-hosted internal admin tool, not a consumer app
       that needs App-Store-quality home-screen icons on every platform. -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231E3A6E'%3E%3Cpath d='M12 2l8 3.5v6.5c0 5.6-3.8 9.4-8 10.7-4.2-1.3-8-5.1-8-10.7V5.5z'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E3A6E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- gstatic.com is where the actual .woff2 font FILES load from (the
       googleapis.com stylesheet just references them) — preconnecting
       only to googleapis.com left that second, later-discovered
       connection to warm up from scratch. §7.3 of the UI/UX review. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 500/800 added: button/label text sets font-weight:500 and the type
       spec calls for an 800 weight on prominent headings — without the
       actual font file loaded, a browser synthesizes ("fake bold")
       instead of rendering the real Inter Medium/ExtraBold. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <!-- Component/page CSS, one dedicated css/ folder (moved out of src/ in
       the glassmorphism refactor pass — was previously co-located with
       each owning .js file under src/; see backend/DEVLOG.md for why).
       Order after base.css doesn't matter between these (no rule here
       overrides another file's selectors), but each file must load
       somewhere. -->
  <link rel="stylesheet" href="css/components/AppShell.css">
  <link rel="stylesheet" href="css/components/PageHeader.css">
  <link rel="stylesheet" href="css/components/DataTable.css">
  <link rel="stylesheet" href="css/components/StatStrip.css">
  <link rel="stylesheet" href="css/components/KpiCard.css">
  <link rel="stylesheet" href="css/components/DonutChart.css">
  <link rel="stylesheet" href="css/components/LineChart.css">
  <link rel="stylesheet" href="css/components/Avatar.css">
  <link rel="stylesheet" href="css/components/LiveMap.css">
  <link rel="stylesheet" href="css/components/Toast.css">
  <link rel="stylesheet" href="css/components/ConfirmDialog.css">
  <link rel="stylesheet" href="css/components/Menu.css">
  <link rel="stylesheet" href="css/pages/login.css">
  <link rel="stylesheet" href="css/pages/dispatch-center.css">
  <link rel="stylesheet" href="css/pages/gis-live-tracking.css">
  <link rel="stylesheet" href="css/pages/ai-review.css">
  <link rel="stylesheet" href="css/pages/blotter-detail.css">
  <link rel="stylesheet" href="css/pages/incident-management.css">

  <link rel="stylesheet" href="css/components/BarChart.css">

  <link rel="stylesheet" href="css/pages/audit-log.css">
  <link rel="stylesheet" href="css/pages/map-packages.css">
  <!--
    MapLibre GL JS v4.7.1, vendored locally under /vendor (not loaded from
    a public CDN) — §1 names MapLibre as the stack's mapping library, and
    §2 Rule 7 treats this as a locally hosted system with no internet
    exposure assumed, so the library file itself shouldn't require a live
    internet connection to load. See web/src/components/LiveMap.js for
    the shared component this backs (W3's map pane + W4 both use it).
  -->
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script>
    // Resolved decision (DEVLOG.md): API base URL is a page-level global,
    // not a build-time env var — §1's stack has no bundler to inject one.
    // The API needs its OWN Apache DocumentRoot (backend/public), not a
    // htdocs subfolder — the front controller matches REQUEST_URI against
    // exactly "/api/v1", so a subfolder mount 404s. Served on its own
    // port instead: see web/README-serving.md ("Option C").
    window.BARANGUARD_API_BASE_URL = 'http://127.0.0.1:8140/api/v1'; // TEMP preview only — disposable baranguard_uiseed DB, not real baranguard
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
