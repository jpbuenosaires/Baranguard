<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,600;8..144,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#eef1f6;font-family:'Roboto Flex',Roboto,sans-serif;color:#0f1f3d}
.status{height:28px;background:#0f1f3d;color:#fff;font-size:12px;display:flex;justify-content:space-between;padding:6px 16px}
.bar{height:64px;background:#0f1f3d;color:#fff;display:flex;align-items:center;padding:0 16px}.bar h1{font-size:22px;font-weight:600}
.band{height:44px;background:linear-gradient(90deg,#b9c3d1,#f4f7fb 40%,#c7d0dc 60%,#eef2f8);display:flex;align-items:center;padding:0 16px;gap:10px;font-weight:600;font-size:14px;color:#0f1f3d;border-bottom:3px solid #ffd23f}
.band em{font-style:normal;margin-left:auto;font-weight:400;font-size:13px}
.call{margin:14px 12px 0;background:#fff;border-radius:16px;padding:16px;border-left:6px solid #ffd23f}
.call small{font-size:12px;letter-spacing:1px;font-weight:600;color:#56657e;text-transform:uppercase}.call h2{font-size:30px;font-weight:800;margin:6px 0 2px}.call p{color:#3c4a63;font-size:15px}
.btn{margin-top:14px;height:52px;border-radius:26px;background:#0f1f3d;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center}
.card{margin:10px 12px 0;background:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}.av{width:44px;height:44px;border-radius:50%;background:#ffd23f;color:#0f1f3d;font-weight:800;display:flex;align-items:center;justify-content:center}
.card b{display:block}.card small{color:#56657e}
.foot{position:absolute;left:12px;right:12px;bottom:96px;display:flex;gap:10px}.foot div{flex:1;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700}
.r{background:#fff;color:#0f1f3d;border:2px solid #0f1f3d}.s{background:#d7263d;color:#fff}
.nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:#0f1f3d;display:flex;justify-content:space-around;padding-top:12px}.nav div{color:#c7d0dc;font-size:12px;text-align:center;width:64px}.nav i{display:block;margin:0 auto 4px;width:56px;height:30px;border-radius:15px}.nav .a{color:#fff}.nav .a i{background:#2b3f66}
</style></head><body>
<div class="status"><span>5:53</span><span>LTE 55%</span></div>
<div class="bar"><h1>Baranguard</h1></div>
<div class="band">● On duty · GPS live<em>1h 12m</em></div>
<div class="call"><small>Active call · INC-2026-067</small><h2>Vandalism</h2><p>Service lane, Dao · 29 km south</p><div class="btn">Respond to call</div></div>
<div class="card"><div class="av">ER</div><div><b>Elmer Reyes</b><small>Tanod · Barangay Dao</small></div></div>
<div class="foot"><div class="r">Report incident</div><div class="s">SOS</div></div>
<div class="nav"><div class="a"><i></i>Home</div><div><i></i>Dispatches</div><div><i></i>Map</div><div><i></i>Profile</div></div>
</body></html>
