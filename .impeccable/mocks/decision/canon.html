<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#fdfbff;font-family:Roboto,sans-serif;color:#1a1b20}
.status{height:28px;font-size:12px;display:flex;justify-content:space-between;padding:6px 16px}
.bar{height:64px;display:flex;align-items:center;padding:0 16px;font-size:22px}
.call{margin:8px 16px;background:#d8e2ff;border-radius:12px;padding:16px}.call small{font-size:12px;font-weight:500;color:#3e4759}.call h2{font-size:24px;font-weight:400;margin:4px 0}.call p{font-size:14px;color:#44474f}
.btn{margin-top:12px;height:40px;border-radius:20px;background:#1b5fc1;color:#fff;font-weight:500;display:inline-flex;align-items:center;padding:0 24px}
.card{margin:8px 16px;background:#f1f0f7;border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center}.av{width:40px;height:40px;border-radius:50%;background:#1b5fc1;color:#fff;display:flex;align-items:center;justify-content:center}
.chips{margin:8px 16px;display:flex;gap:8px}.chips span{border:1px solid #c4c6d0;border-radius:8px;padding:6px 12px;font-size:14px}
.sos{position:absolute;left:16px;bottom:100px;height:56px;padding:0 24px;border-radius:16px;background:#ba1a1a;color:#fff;font-weight:500;display:flex;align-items:center}
.fab{position:absolute;right:16px;bottom:100px;height:56px;padding:0 20px;border-radius:16px;background:#d8e2ff;color:#001a41;font-weight:500;display:flex;align-items:center}
.nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:#f1f0f7;display:flex;justify-content:space-around;padding-top:12px}.nav div{font-size:12px;text-align:center;width:64px}.nav i{display:block;margin:0 auto 4px;width:56px;height:30px;border-radius:15px}.nav .a i{background:#d8e2ff}
</style></head><body>
<div class="status"><span>5:53</span><span>LTE 55%</span></div>
<div class="bar">Baranguard</div>
<div class="call"><small>Active call · INC-2026-067</small><h2>Vandalism</h2><p>Service lane, Dao · 29 km south</p><div class="btn">Respond</div></div>
<div class="card"><div class="av">ER</div><div><div>Elmer Reyes</div><small>Tanod · Barangay Dao</small></div></div>
<div class="chips"><span>On duty</span><span>GPS live</span><span>All sent</span></div>
<div class="sos">SOS</div><div class="fab">＋ Report</div>
<div class="nav"><div class="a"><i></i>Home</div><div><i></i>Dispatches</div><div><i></i>Map</div><div><i></i>Profile</div></div>
</body></html>
