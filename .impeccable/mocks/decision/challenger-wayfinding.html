<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#f2f2f0;font-family:'Hanken Grotesk',sans-serif;color:#111}
.status{height:28px;background:#111;color:#fff;font-size:12px;display:flex;justify-content:space-between;padding:6px 16px}
.bar{height:64px;background:#111;color:#fff;display:flex;align-items:center;padding:0 16px;font-size:20px;font-weight:700}
.sign{background:#ffd100;padding:16px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.pic{width:64px;height:64px;background:#111;border-radius:6px;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center}
.sign small{font-weight:700;font-size:14px}.sign h2{font-size:34px;font-weight:800;line-height:1.05}.sign p{font-weight:500;font-size:16px}
.go{margin:12px;height:52px;border-radius:8px;background:#111;color:#ffd100;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
.list{margin:0 12px;background:#fff;border-radius:8px}.list div{padding:14px 16px;border-bottom:1px solid #e4e4e0;display:flex;justify-content:space-between;font-weight:500}
.sos{position:absolute;left:12px;right:12px;bottom:96px;height:56px;border-radius:8px;background:#d5001c;color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding-top:12px}.nav div{font-size:12px;text-align:center;width:64px;color:#555}.nav i{display:block;margin:0 auto 4px;width:56px;height:30px;border-radius:15px}.nav .a{color:#111}.nav .a i{background:#ffd100}
</style></head><body>
<div class="status"><span>5:53</span><span>LTE 55%</span></div>
<div class="bar">Baranguard</div>
<div class="sign"><div class="pic">↓</div><div><small>Next · INC-2026-067</small><h2>Service lane, Dao</h2><p>Vandalism · 29 km south</p></div></div>
<div class="go">Go en route</div>
<div class="list"><div><span>On duty</span><span>1h 12m</span></div><div><span>GPS</span><span>Sharing live</span></div><div><span>Waiting to send</span><span>Nothing</span></div></div>
<div class="sos">SOS</div>
<div class="nav"><div class="a"><i></i>Home</div><div><i></i>Dispatches</div><div><i></i>Map</div><div><i></i>Profile</div></div>
</body></html>
