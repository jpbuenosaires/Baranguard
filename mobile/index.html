<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ionic App</title>
    
    <base href="/" />
    
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('baranguard.theme');
          var explicit = stored === 'light' || stored === 'dark';
          var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          document.documentElement.setAttribute(
            'data-theme',
            explicit ? stored : (mq && mq.matches ? 'dark' : 'light')
          );
          if (!explicit && mq && mq.addEventListener) {
            mq.addEventListener('change', function (e) {
              var now = null;
              try { now = localStorage.getItem('baranguard.theme'); } catch (err) {}
              if (now === 'light' || now === 'dark') return;
              document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            });
          }
        } catch (e) {
          try {
            var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
            document.documentElement.setAttribute('data-theme', m && m.matches ? 'dark' : 'light');
          } catch (e2) {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
