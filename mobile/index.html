<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Baranguard</title>
    
    <base href="/" />
    
    <meta name="color-scheme" content="light" id="meta-color-scheme" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <!-- Mobile Status Bar theme color -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baranguard" />
    <script>
      (function () {
        function syncStatusBars(theme) {
          var isDark = theme === 'dark';
          var cs = document.getElementById('meta-color-scheme');
          if (cs) cs.setAttribute('content', isDark ? 'dark' : 'light');
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', isDark ? '#1e293b' : '#ffffff');
        }

        try {
          var stored = localStorage.getItem('baranguard.theme');
          var theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          syncStatusBars(theme);

          var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          if (!stored && mq && mq.addEventListener) {
            mq.addEventListener('change', function (e) {
              if (localStorage.getItem('baranguard.theme')) return;
              var t = e.matches ? 'dark' : 'light';
              document.documentElement.setAttribute('data-theme', t);
              syncStatusBars(t);
            });
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          syncStatusBars('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
