# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# REMOVED 2026-09-03: -Djava.nio.channels.spi.SelectorProvider=
# sun.nio.ch.WindowsSelectorProvider. It was added to work around the
# original "Unable to establish loopback connection" bug (JDK 17's
# WEPollSelectorProvider building its wakeup Pipe via a broken AF_UNIX
# socket under this machine's space-containing TEMP path) — but that same
# bug was ALSO independently fixed, earlier the same session, by
# redirecting TMPDIR/TEMP/TMP/-Djava.io.tmpdir to a short space-free path
# (`C:\gtmp`, set via environment variables on every gradlew invocation —
# see the checked-in test-plan notes / DEVLOG). The two fixes were
# redundant. Forcing the LEGACY selector provider network-wide then broke
# something else: real dependency downloads from dl.google.com and
# repo.maven.apache.org started failing with TLS handshake resets ("remote
# host terminated the handshake") and DNS-lookup-shaped errors, even
# though plain `curl` and a standalone JDK 17/21 HttpURLConnection test
# BOTH reached those exact hosts fine — isolating the failure to
# something Gradle's own async HTTP download client does differently
# under the legacy selector vs. the modern one it presumably expects.
# Removing this line (keeping only the TMPDIR env-var fix) is the
# corrected, minimal fix.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# All 6 Capacitor native plugin modules request an exact Java 21
# toolchain for compilation (confirmed in each plugin's own
# android/build.gradle — sourceCompatibility/targetCompatibility
# JavaVersion.VERSION_21). CORRECTION to this comment's own earlier claim:
# Android Studio's bundled JBR (JDK 25) does NOT satisfy a
# languageVersion(21) request — tested directly, registering it alongside
# JDK 17 produced the identical "Cannot find a Java installation...
# matching: {languageVersion=21...}" failure, unchanged. Gradle's
# toolchain resolution for languageVersion is an EXACT major-version
# match, not "any JVM >= requested" — confirmed the hard way, not assumed
# from docs. A real JDK 21 install (Temurin, installed 2026-09-03) is the
# only thing that actually works; the paths below are every JDK known to
# exist on this machine, kept registered together since it costs nothing.
org.gradle.java.installations.paths=C:/Program Files/Eclipse Adoptium/jdk-17.0.12.7-hotspot,C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot,C:/Program Files/Android/Android Studio/jbr
