<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" width="1000" height="1020" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#111"/></marker></defs><rect width="1000" height="1020" fill="#fff"/><text x="500" y="24" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Process flow of the main transaction: from incident report to resolution</text><rect x="220.0" y="45.0" width="240" height="34" rx="17.0" fill="#e8f0e8" stroke="#111" stroke-width="1.4"/><text x="340" y="66.025" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#111">Report received</text><rect x="190.0" y="104.0" width="300" height="62" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="340" y="124.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Staff or tanod logs the incident (type, place,</text><text x="340" y="138.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">report channel); a tanod phone saves it first in</text><text x="340" y="152.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">encrypted SQLite</text><polyline points="340,192.0 460.0,232 340,272.0 220.0,232 340,192.0" fill="none" stroke="#111" stroke-width="1.4"/><text x="340" y="228.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Connection to the server</text><text x="340" y="242.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">available?</text><rect x="650.0" y="200.0" width="220" height="64" rx="6" fill="#fff4e0" stroke="#111" stroke-width="1.4"/><text x="760" y="222.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Record waits in the offline queue and</text><text x="760" y="235.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">is sent with its own event id when the</text><text x="760" y="249.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">phone reconnects</text><rect x="190.0" y="306.0" width="300" height="52" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="340" y="328.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Server checks role and barangay, stores the</text><text x="340" y="342.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">incident as Pending with code INC-YYYY-NNN</text><polyline points="340,390.0 460.0,430 340,470.0 220.0,430 340,390.0" fill="none" stroke="#111" stroke-width="1.4"/><text x="340" y="426.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Night shift (18:00 to</text><text x="340" y="440.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">06:00)?</text><rect x="45.0" y="500.0" width="210" height="80" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="150" y="523.425" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Chief Tanod assigns a rostered on-</text><text x="150" y="536.925" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">duty tanod; a published shift is</text><text x="150" y="550.425" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">needed unless an override reason is</text><text x="150" y="563.925" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">given</text><rect x="425.0" y="500.0" width="210" height="80" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="530" y="523.425" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Offer goes to on-duty tanods in</text><text x="530" y="536.925" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">rounds of 180 s; the first to accept</text><text x="530" y="550.425" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">is assigned; after 3 rounds the</text><text x="530" y="563.925" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Admin is reminded</text><rect x="190.0" y="616.0" width="300" height="48" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="340" y="636.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Push alert and SMS reach the tanod; the incident</text><text x="340" y="650.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">becomes Dispatched</text><rect x="190.0" y="690.0" width="300" height="64" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="340" y="711.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Tanod gets a road route, shares GPS, marks</text><text x="340" y="725.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Responding then Arrived (response time stops at</text><text x="340" y="739.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">the earliest arrival)</text><rect x="190.0" y="787.0" width="300" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="340" y="808.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Tanod records evidence and notes, and any</text><text x="340" y="822.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">referral to PNP, BFP or EMS</text><rect x="190.0" y="867.0" width="300" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="340" y="888.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Chief Tanod resolves the incident (a reason is</text><text x="340" y="902.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">required if no dispatch was made)</text><rect x="190.0" y="940.0" width="300" height="44" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="340" y="965.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Audit entry written (identifiers only)</text><rect x="260.0" y="988.0" width="160" height="28" rx="14.0" fill="#e8f0e8" stroke="#111" stroke-width="1.4"/><text x="340" y="1006.025" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#111">Closed</text><polyline points="340,79 340,104" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="340,166 340,192" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="340,272 340,306" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="340,358 340,390" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="340,664 340,690" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="340,754 340,787" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="340,837 340,867" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="340,917 340,940" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="340,984 340,988" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="341.495" y="272.75" width="25.01" height="16.5" fill="#fff" fill-opacity="0.92"/><text x="354" y="284.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">Yes</text><polyline points="460,232 650,232" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="520.33" y="211.75" width="19.34" height="16.5" fill="#fff" fill-opacity="0.92"/><text x="530" y="223.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">No</text><polyline points="760,264 760,332 490,332" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="220,430 150,430 150,500" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="148.32" y="408.75" width="53.36" height="16.5" fill="#fff" fill-opacity="0.92"/><text x="175" y="420.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">No (day)</text><polyline points="460,430 530,430 530,500" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="492.495" y="408.75" width="25.01" height="16.5" fill="#fff" fill-opacity="0.92"/><text x="505" y="420.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">Yes</text><polyline points="150,580 150,640 190,640" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="530,580 530,640 490,640" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/></svg>