<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1090" width="1100" height="1090" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect width="1100" height="1090" fill="#fff"/><text x="550.0" y="24" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Process flow of the main transaction: from incident report to resolution</text><rect x="260" y="45" width="240" height="34" rx="17" fill="#e8f0e8" stroke="#111" stroke-width="1.4"/><text x="380.0" y="65.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">Report received</text><polyline points="380,79 380,100" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="100" width="300" height="62" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="380.0" y="120.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Staff or tanod logs the incident (type, place,</text><text x="380.0" y="134.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">report channel); a tanod phone saves it first in</text><text x="380.0" y="148.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">encrypted SQLite</text><polyline points="380,162 380,190" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="380,190 510,230 380,270 250,230 380,190" fill="#fff" stroke="#111" stroke-width="1.4"/><text x="380" y="226.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Connection to the server</text><text x="380" y="240.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">available?</text><polyline points="510,230 640,230" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><text x="575" y="233.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">No</text><rect x="640" y="195" width="260" height="70" rx="6" fill="#fff3dc" stroke="#111" stroke-width="1.4"/><text x="770.0" y="219.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Record waits in the offline queue and</text><text x="770.0" y="233.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">is sent with its own event id when</text><text x="770.0" y="247.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">the phone reconnects</text><polyline points="380,270 380,310" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><text x="398" y="293.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Yes</text><rect x="230" y="310" width="300" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="380.0" y="331.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Server checks role and barangay, stores the</text><text x="380.0" y="345.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">incident as Pending with code INC-YYYY-NNN</text><polyline points="770,265 770,335 530,335" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="380,360 380,400" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="380,400 510,440 380,480 250,440 380,400" fill="#fff" stroke="#111" stroke-width="1.4"/><text x="380" y="443.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Night shift (18:00 to 06:00)?</text><polyline points="250,440 160,440 160,500" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><text x="205" y="443.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">No (day)</text><rect x="30" y="500" width="260" height="70" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="160.0" y="524.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Chief Tanod assigns a rostered on-</text><text x="160.0" y="538.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">duty tanod; a published shift is needed</text><text x="160.0" y="552.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">unless an override reason is given</text><polyline points="510,440 600,440 600,500" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><text x="555" y="443.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Yes</text><rect x="470" y="500" width="260" height="70" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="600.0" y="524.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Offer goes to on-duty tanods in rounds</text><text x="600.0" y="538.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">of 180 s; the first to accept is assigned;</text><text x="600.0" y="552.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">after 3 rounds the Chief Tanod is reminded</text><polyline points="160,570 160,615 230,615" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="600,570 600,615 530,615" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="595" width="300" height="40" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="380.0" y="611.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Push alert and SMS reach the tanod;</text><text x="380.0" y="625.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">the incident becomes Dispatched</text><polyline points="380,635 380,670" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="670" width="300" height="62" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="380.0" y="690.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Tanod gets a road route, shares GPS, marks</text><text x="380.0" y="704.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Responding then Arrived (response time</text><text x="380.0" y="718.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">stops at the earliest arrival)</text><polyline points="380,732 380,765" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="765" width="300" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="380.0" y="786.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Tanod records evidence and notes, and any</text><text x="380.0" y="800.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">referral to PNP, BFP, EMS or another office</text><polyline points="380,815 380,850" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="850" width="300" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="380.0" y="871.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Chief Tanod resolves the incident (a reason</text><text x="380.0" y="885.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">is required if no dispatch was made)</text><rect x="640" y="850" width="300" height="56" rx="6" fill="#fff3dc" stroke="#111" stroke-width="1.4" stroke-dasharray="5 4"/><text x="790.0" y="867.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">The Secretary may mark an incident</text><text x="790.0" y="881.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">duplicate, invalid or cancelled, or reopen</text><text x="790.0" y="895.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">a closed one</text><polyline points="640,878 530,878" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><polyline points="380,900 380,935" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="935" width="300" height="36" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="380.0" y="956.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Audit entry written (identifiers only)</text><polyline points="380,971 380,1010" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="290" y="1010" width="180" height="34" rx="17" fill="#e8f0e8" stroke="#111" stroke-width="1.4"/><text x="380.0" y="1030.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">Closed</text><rect x="640" y="60" width="300" height="92" rx="6" fill="#fff3dc" stroke="#111" stroke-width="1.4" stroke-dasharray="5 4"/><text x="790.0" y="88.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">SOS alerts follow a separate path: sent</text><text x="790.0" y="102.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">over data, or as an encrypted SMS to the</text><text x="790.0" y="116.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">gateway phone when data is lost; the Chief</text><text x="790.0" y="130.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Tanod acknowledges and resolves them</text><polyline points="640,106 530,131" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/></svg>