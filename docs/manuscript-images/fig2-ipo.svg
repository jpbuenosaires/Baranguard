<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#111"/></marker></defs><rect width="900" height="520" fill="#fff"/><text x="450" y="26" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Input-Process-Output (IPO) model of Baranguard</text><rect x="30" y="48" width="240" height="440" rx="6" fill="#e8f0fe" stroke="#111" stroke-width="1.4"/><text x="150" y="74" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">INPUT</text><text x="44" y="100" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Incident reports logged by</text><text x="44" y="115" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">staff: walk-in, phone call,</text><text x="44" y="130" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">Facebook message, SMS</text><text x="44" y="154" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Field capture by tanods on the</text><text x="44" y="169" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">Android app, including while</text><text x="44" y="184" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">offline</text><text x="44" y="208" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• GPS fixes, duty status and</text><text x="44" y="223" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">check-ins from tanod phones</text><text x="44" y="247" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• SOS alerts: over data, or as an</text><text x="44" y="262" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">encrypted SMS to the gateway phone</text><text x="44" y="286" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Administrative data: barangays,</text><text x="44" y="301" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">users, devices, schools, shifts</text><rect x="330" y="48" width="240" height="440" rx="6" fill="#e6f4ea" stroke="#111" stroke-width="1.4"/><text x="450" y="74" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">PROCESS</text><text x="344" y="100" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Idempotent sync of the phone</text><text x="344" y="115" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">queue to the local server</text><text x="344" y="139" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Decoding of SMS envelopes</text><text x="344" y="154" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">received by the gateway phone</text><text x="344" y="178" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Dispatch, night dispatch offers</text><text x="344" y="193" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">(first accept wins) and routing</text><text x="344" y="217" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Role-based access, tenant</text><text x="344" y="232" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">isolation and audit log</text><text x="344" y="256" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Rostering, accomplishment</text><text x="344" y="271" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">reports and school-zone reports</text><text x="344" y="295" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• All on one administrative</text><text x="344" y="310" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">workstation reachable over the</text><text x="344" y="325" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">barangay LAN</text><rect x="630" y="48" width="240" height="440" rx="6" fill="#fef7e0" stroke="#111" stroke-width="1.4"/><text x="750" y="74" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">OUTPUT</text><text x="644" y="100" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Dispatch assignments, offers and</text><text x="644" y="115" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">push alerts to tanod phones</text><text x="644" y="139" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Dispatch queue, live map, SOS</text><text x="644" y="154" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">panel and incident records</text><text x="644" y="178" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Heatmaps, statistics and exports</text><text x="644" y="193" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">for officials</text><text x="644" y="217" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Printed A4 reports for paper</text><text x="644" y="232" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">signing: roster, accomplishment</text><text x="644" y="247" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">report, Annex B, C-1, D</text><text x="644" y="271" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Audit log of who did what</text><text x="644" y="286" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">(identifiers only)</text><line x1="270" y1="268" x2="328" y2="268" stroke="#111" stroke-width="2.4" marker-end="url(#ah)"/><line x1="570" y1="268" x2="628" y2="268" stroke="#111" stroke-width="2.4" marker-end="url(#ah)"/></svg>