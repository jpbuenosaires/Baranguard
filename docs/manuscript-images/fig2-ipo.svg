<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="900" height="599" fill="#fff"/><text x="450" y="28" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">Input-Process-Output model of the Baranguard system</text><rect x="24" y="50" width="270" height="399" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/><line x1="24" y1="90" x2="294" y2="90" stroke="#000" stroke-width="1.2"/><text x="159" y="76" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">INPUT</text><text x="36" y="108" font-size="13" fill="#000"><tspan font-weight="bold">[b]</tspan> Incidents logged by staff:</text><text x="36" y="124" font-size="13" text-anchor="start" font-weight="normal" fill="#000">walk-in, phone call, Facebook</text><text x="36" y="140" font-size="13" text-anchor="start" font-weight="normal" fill="#000">message, SMS</text><text x="36" y="165" font-size="13" fill="#000"><tspan font-weight="bold">[b]</tspan> Administrative data: barangays,</text><text x="36" y="181" font-size="13" text-anchor="start" font-weight="normal" fill="#000">users, devices, schools, shifts</text><text x="36" y="206" font-size="13" fill="#000"><tspan font-weight="bold">[c]</tspan> Field capture by tanods on the</text><text x="36" y="222" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Android app, online or offline</text><text x="36" y="247" font-size="13" fill="#000"><tspan font-weight="bold">[b, c]</tspan> GPS fixes, duty status,</text><text x="36" y="263" font-size="13" text-anchor="start" font-weight="normal" fill="#000">availability and accomplishment</text><text x="36" y="279" font-size="13" text-anchor="start" font-weight="normal" fill="#000">entries</text><text x="36" y="304" font-size="13" fill="#000"><tspan font-weight="bold">[d]</tspan> SOS alerts sent over data, or by</text><text x="36" y="320" font-size="13" text-anchor="start" font-weight="normal" fill="#000">SMS when data fails</text><text x="36" y="345" font-size="13" fill="#000"><tspan font-weight="bold">[e]</tspan> Evaluators: personnel of the</text><text x="36" y="361" font-size="13" text-anchor="start" font-weight="normal" fill="#000">four barangays and IT experts</text><text x="36" y="386" font-size="13" fill="#000"><tspan font-weight="bold">[e]</tspan> Instruments: ISO/IEC 25010:2023</text><text x="36" y="402" font-size="13" text-anchor="start" font-weight="normal" fill="#000">questionnaire, UAT task scripts, SUS</text><rect x="315" y="50" width="270" height="399" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/><line x1="315" y1="90" x2="585" y2="90" stroke="#000" stroke-width="1.2"/><text x="450" y="76" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">PROCESS</text><text x="327" y="108" font-size="13" fill="#000"><tspan font-weight="bold">[c]</tspan> Idempotent sync of the phone</text><text x="327" y="124" font-size="13" text-anchor="start" font-weight="normal" fill="#000">queue (device ID + client_event_id)</text><text x="327" y="149" font-size="13" fill="#000"><tspan font-weight="bold">[d]</tspan> Verification and decryption of</text><text x="327" y="165" font-size="13" text-anchor="start" font-weight="normal" fill="#000">SMS envelopes received by the gateway</text><text x="327" y="181" font-size="13" text-anchor="start" font-weight="normal" fill="#000">phone</text><text x="327" y="206" font-size="13" fill="#000"><tspan font-weight="bold">[b]</tspan> Dispatch, night dispatch offers</text><text x="327" y="222" font-size="13" text-anchor="start" font-weight="normal" fill="#000">(first accept wins) and routing</text><text x="327" y="247" font-size="13" fill="#000"><tspan font-weight="bold">[b]</tspan> Aggregation of the live map,</text><text x="327" y="263" font-size="13" text-anchor="start" font-weight="normal" fill="#000">heatmaps and descriptive reports</text><text x="327" y="288" font-size="13" fill="#000"><tspan font-weight="bold">[b-d]</tspan> Role, barangay and ownership</text><text x="327" y="304" font-size="13" text-anchor="start" font-weight="normal" fill="#000">checks; identifier-only audit log</text><text x="327" y="329" font-size="13" fill="#000"><tspan font-weight="bold">[b]</tspan> Supporting modules: rostering,</text><text x="327" y="345" font-size="13" text-anchor="start" font-weight="normal" fill="#000">accomplishment and school-zone</text><text x="327" y="361" font-size="13" text-anchor="start" font-weight="normal" fill="#000">reports</text><text x="327" y="386" font-size="13" fill="#000"><tspan font-weight="bold">[e]</tspan> UAT sessions (completion, time,</text><text x="327" y="402" font-size="13" text-anchor="start" font-weight="normal" fill="#000">errors), SUS scoring, weighted mean</text><text x="327" y="418" font-size="13" text-anchor="start" font-weight="normal" fill="#000">per characteristic</text><rect x="606" y="50" width="270" height="399" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/><line x1="606" y1="90" x2="876" y2="90" stroke="#000" stroke-width="1.2"/><text x="741" y="76" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">OUTPUT</text><text x="618" y="108" font-size="13" fill="#000"><tspan font-weight="bold">[b]</tspan> Dispatch assignments, offers and</text><text x="618" y="124" font-size="13" text-anchor="start" font-weight="normal" fill="#000">push alerts on tanod phones</text><text x="618" y="149" font-size="13" fill="#000"><tspan font-weight="bold">[b]</tspan> Dispatch queue, near-real-time</text><text x="618" y="165" font-size="13" text-anchor="start" font-weight="normal" fill="#000">live map and incident records</text><text x="618" y="190" font-size="13" fill="#000"><tspan font-weight="bold">[b]</tspan> Heatmaps and descriptive reports</text><text x="618" y="206" font-size="13" text-anchor="start" font-weight="normal" fill="#000">for officials</text><text x="618" y="231" font-size="13" fill="#000"><tspan font-weight="bold">[b]</tspan> Printed A4 roster,</text><text x="618" y="247" font-size="13" text-anchor="start" font-weight="normal" fill="#000">accomplishment and annex reports for</text><text x="618" y="263" font-size="13" text-anchor="start" font-weight="normal" fill="#000">paper signing</text><text x="618" y="288" font-size="13" fill="#000"><tspan font-weight="bold">[c]</tspan> Field records synchronized once,</text><text x="618" y="304" font-size="13" text-anchor="start" font-weight="normal" fill="#000">without duplicates</text><text x="618" y="329" font-size="13" fill="#000"><tspan font-weight="bold">[d]</tspan> SOS alerts carried by the</text><text x="618" y="345" font-size="13" text-anchor="start" font-weight="normal" fill="#000">best-effort SMS path</text><text x="618" y="370" font-size="13" fill="#000"><tspan font-weight="bold">[e]</tspan> Quality ratings per ISO/IEC</text><text x="618" y="386" font-size="13" text-anchor="start" font-weight="normal" fill="#000">25010 characteristic, UAT results and</text><text x="618" y="402" font-size="13" text-anchor="start" font-weight="normal" fill="#000">SUS scores</text><line x1="294" y1="249" x2="313" y2="249" stroke="#000" stroke-width="2.4" marker-end="url(#ah)"/><line x1="585" y1="249" x2="604" y2="249" stroke="#000" stroke-width="2.4" marker-end="url(#ah)"/><path d="M741,449 L741,489 L159,489 L159,451" fill="none" stroke="#000" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#ah)"/><line x1="450" y1="489" x2="450" y2="451" stroke="#000" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#ah)"/><text x="450" y="511" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">Feedback: defects and evaluator findings return to development (next Scrum sprint) before re-testing</text><text x="450" y="543" font-size="13" text-anchor="middle" font-weight="normal" fill="#000">Objectives:  b GIS-enabled web command center   |   c Offline-first mobile app</text><text x="450" y="561" font-size="13" text-anchor="middle" font-weight="normal" fill="#000">d SMS best-effort SOS fallback   |   e Evaluation (ISO/IEC 25010:2023, UAT, SUS)</text><text x="450" y="585" font-size="12" text-anchor="middle" font-weight="normal" fill="#000" font-style="italic">Processing runs on one administrative workstation reachable over the barangay LAN.</text></svg>