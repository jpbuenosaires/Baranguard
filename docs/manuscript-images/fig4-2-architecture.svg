<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#111"/></marker></defs><rect width="1200" height="760" fill="#fff"/><text x="600" y="24" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">System architecture: one administrative workstation, two client applications and a GSM gateway phone</text><rect x="20" y="50" width="330" height="330" rx="8" fill="#f4f7fb" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/><text x="185" y="72" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Client tier</text><rect x="40.0" y="95.0" width="290" height="90" rx="6" fill="#dfe8f7" stroke="#111" stroke-width="1.4"/><text x="185" y="122.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Web dashboard (browser)</text><text x="185" y="136.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Vanilla JavaScript, MapLibre map</text><text x="185" y="150.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Admin / Chief Tanod, Secretary,</text><text x="185" y="164.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Punong Barangay</text><rect x="40.0" y="200.0" width="290" height="110" rx="6" fill="#dfe8f7" stroke="#111" stroke-width="1.4"/><text x="185" y="230.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Tanod Android application</text><text x="185" y="244.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Ionic React 9 + Capacitor 8.5</text><text x="185" y="258.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Encrypted SQLite (SQLCipher) store</text><text x="185" y="272.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">and offline queue; background GPS;</text><text x="185" y="286.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Chief Tanod 4-tab console</text><rect x="40.0" y="330.0" width="290" height="30" rx="4" fill="#fff" stroke="#111" stroke-width="1.4"/><text x="185" y="348.5" font-size="10" text-anchor="middle" font-weight="normal" fill="#111">Roles: Admin, Secretary, Punong Barangay, Tanod</text><rect x="430" y="50" width="520" height="560" rx="8" fill="#f3f9f3" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/><text x="690" y="72" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Administrative workstation (Windows 11, XAMPP)</text><rect x="460.0" y="98.0" width="460" height="54" rx="6" fill="#e3f1e3" stroke="#111" stroke-width="1.4"/><text x="690" y="128.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Apache 2.4  |  web dashboard :80  |  API virtual host :8081</text><rect x="460.0" y="180.0" width="460" height="90" rx="6" fill="#e3f1e3" stroke="#111" stroke-width="1.4"/><text x="690" y="214.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">PHP 8.2 REST API  /api/v1  (103 routes)</text><text x="690" y="228.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Authentication and session policy, role / barangay / ownership checks,</text><text x="690" y="242.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">idempotent writes, audit log, retention, dispatch offers, SMS envelopes</text><rect x="460.0" y="312.0" width="460" height="56" rx="6" fill="#e3f1e3" stroke="#111" stroke-width="1.4"/><text x="690" y="344.025" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#111">MariaDB 10.4  (34 tables, 45 numbered migrations)</text><rect x="452.5" y="407.0" width="215" height="66" rx="6" fill="#e3f1e3" stroke="#111" stroke-width="1.4"/><text x="560" y="430.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">File storage outside the web root</text><text x="560" y="443.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">evidence, map packages,</text><text x="560" y="457.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">encrypted backups</text><rect x="712.5" y="407.0" width="215" height="66" rx="6" fill="#e3f1e3" stroke="#111" stroke-width="1.4"/><text x="820" y="430.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Scheduled jobs</text><text x="820" y="443.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">backup and retention, restore drill,</text><text x="820" y="457.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">dispatch-offer sweeper, PB digest</text><rect x="460.0" y="513.0" width="460" height="54" rx="6" fill="#e3f1e3" stroke="#111" stroke-width="1.4"/><text x="690" y="536.925" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">GSM ingest daemon: reads SOS messages from the gateway phone</text><text x="690" y="550.425" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">and posts them to the API (loopback and token only)</text><rect x="1000" y="50" width="180" height="560" rx="8" fill="#fbf6ec" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1090" y="72" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">External services</text><rect x="1015.0" y="101.0" width="150" height="58" rx="6" fill="#fff4e0" stroke="#111" stroke-width="1.4"/><text x="1090" y="120.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Cloudflare Tunnel</text><text x="1090" y="133.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">baranguardph.win</text><text x="1090" y="147.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">api.baranguardph.win</text><rect x="1015.0" y="199.0" width="150" height="52" rx="6" fill="#fff4e0" stroke="#111" stroke-width="1.4"/><text x="1090" y="221.925" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Firebase Cloud</text><text x="1090" y="235.425" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Messaging (push)</text><rect x="1015.0" y="284.0" width="150" height="52" rx="6" fill="#fff4e0" stroke="#111" stroke-width="1.4"/><text x="1090" y="300.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">OpenRouteService</text><text x="1090" y="313.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">(road routes, daily</text><text x="1090" y="327.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">quota)</text><rect x="1015.0" y="369.0" width="150" height="52" rx="6" fill="#fff4e0" stroke="#111" stroke-width="1.4"/><text x="1090" y="391.925" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">OpenStreetMap tiles</text><text x="1090" y="405.425" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">and cached map packages</text><rect x="1015.0" y="465.0" width="150" height="70" rx="6" fill="#fff4e0" stroke="#111" stroke-width="1.4"/><text x="1090" y="490.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Cellular network</text><text x="1090" y="503.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">(SMS) with the SIM</text><text x="1090" y="517.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">of the gateway phone</text><rect x="525.0" y="655.0" width="330" height="60" rx="6" fill="#e8e4f5" stroke="#111" stroke-width="1.4"/><text x="690" y="675.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">GSM gateway phone (Android, own SIM)</text><text x="690" y="688.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">sends outbound SMS, receives SOS messages</text><text x="690" y="702.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">connected to the workstation by USB</text><line x1="330" y1="140" x2="460" y2="125" stroke="#111" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ahs)"/><rect x="359.815" y="103.75" width="70.37" height="16.5" fill="#fff" fill-opacity="0.92"/><text x="395" y="115.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">HTTPS, JSON</text><line x1="330" y1="255" x2="460" y2="235" stroke="#111" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ahs)"/><rect x="356.98" y="253.5" width="76.04" height="29.0" fill="#fff" fill-opacity="0.92"/><text x="395" y="264.925" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">HTTPS, JSON</text><text x="395" y="278.425" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">sync batches</text><line x1="690" y1="152" x2="690" y2="180" stroke="#111" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ahs)"/><line x1="690" y1="270" x2="690" y2="312" stroke="#111" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ahs)"/><line x1="920" y1="125" x2="1015" y2="130" stroke="#111" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ahs)"/><line x1="920" y1="235" x2="1015" y2="228" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><line x1="920" y1="262" x2="1015" y2="310" stroke="#111" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ahs)"/><line x1="690" y1="568" x2="690" y2="655" stroke="#111" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ahs)"/><line x1="690" y1="513" x2="690" y2="368" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><line x1="850" y1="700" x2="1030" y2="540" stroke="#111" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ahs)"/><rect x="947.495" y="631.75" width="25.01" height="16.5" fill="#fff" fill-opacity="0.92"/><text x="960" y="643.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">SMS</text><polyline points="185,380 185,700 525,700" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="148.63" y="539.25" width="132.74" height="41.5" fill="#fff" fill-opacity="0.92"/><text x="215" y="550.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">Encrypted SOS SMS when</text><text x="215" y="563.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">the data connection is</text><text x="215" y="577.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">lost</text></svg>