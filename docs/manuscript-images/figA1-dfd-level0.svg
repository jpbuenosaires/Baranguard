atch</text><text x="280.0" y="87.5" font-size="10" text-anchor="middle" font-weight="normal" fill="#222">orders, rosters, user</text><text x="280.0" y="100.5" font-size="10" text-anchor="middle" font-weight="normal" fill="#222">administration</text><line x1="380" y1="134" x2="180" y2="134" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="208.5" y="142.0" width="143.0" height="28" fill="#fff" fill-opacity="0.92"/><text x="280.0" y="153.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#222">dispatch queue, live map,</text><text x="280.0" y="166.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#222">alerts, printable reports</text><rect x="10" y="284" width="170" height="72" rx="0" fill="#fff" stroke="#111" stroke-width="1.8"/><text x="95" y="316.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Tanods</text><text x="95" y="331.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">(Android app)</text><line x1="180" y1="306" x2="380" y2="306" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="200.39999999999998" y="264.0" width="159.20000000000002" height="40" fill="#fff" fill-opacity="0.92"/><text x="280.0" y="274.5" font-size="10" text-anchor="middle" font-weight="normal" fill="#222">incidents, GPS, duty status,</text><text x="280.0" y="287.5" font-size="10" text-anchor="middle" font-weight="normal" fill="#222">SOS, check-ins,</text><text x="280.0" y="300.5" font-size="10" text-anchor="middle" font-weight="normal" fill="#222">accomplishment entries</text><line x1="380" y1="334" x2="180" y2="334" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="200.39999999999998" y="342.0" width="159.20000000000002" height="28" fill="#fff" fill-opacity="0.92"/><text x="280.0" y="353.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#222">assignments, offers, routes,</text><text x="280.0" y="366.0" font-size="10" text-anchor="middle" font-weight="normal" f