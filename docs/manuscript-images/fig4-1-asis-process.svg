<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#111"/></marker></defs><rect width="1000" height="880" fill="#fff"/><text x="500" y="24" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Current (as-is) process of recording and dispatching an incident in the barangay</text><rect x="180.0" y="46.0" width="300" height="40" rx="20.0" fill="#e8f0e8" stroke="#111" stroke-width="1.4"/><text x="330" y="62.775" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#111">Resident reports an incident (walk-in, call,</text><text x="330" y="77.275" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#111">Facebook message or SMS)</text><rect x="195.0" y="115.0" width="270" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="330" y="136.775" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">Tanod or staff on duty hears the report</text><text x="330" y="151.275" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">and writes it by hand in the logbook</text><rect x="195.0" y="195.0" width="270" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="330" y="216.775" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">Chief Tanod decides who to send and phones</text><text x="330" y="231.275" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">or texts each tanod one by one</text><polyline points="330,270.0 445.0,312 330,354.0 215.0,312 330,270.0" fill="none" stroke="#111" stroke-width="1.4"/><text x="330" y="308.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">Tanod reachable and</text><text x="330" y="322.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">available?</text><rect x="195.0" y="385.0" width="270" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="330" y="406.775" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">Tanod goes to the scene; the Chief Tanod</text><text x="330" y="421.275" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">has no live position or status</text><rect x="195.0" y="465.0" width="270" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="330" y="486.775" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">Tanod reports back by phone or in person</text><text x="330" y="501.275" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">after the response</text><rect x="195.0" y="545.0" width="270" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="330" y="566.775" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">Entry is completed or corrected in the</text><text x="330" y="581.275" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">logbook and signed by a supervisor</text><rect x="195.0" y="625.0" width="270" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="330" y="646.775" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">At month end the monthly and school-zone</text><text x="330" y="661.275" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">reports are compiled and typed by hand</text><rect x="195.0" y="705.0" width="270" height="50" rx="6" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><text x="330" y="726.775" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">Paper records are filed in binders (the</text><text x="330" y="741.275" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111">official blotter stays with the barangay)</text><rect x="250.0" y="788.0" width="160" height="34" rx="17.0" fill="#e8f0e8" stroke="#111" stroke-width="1.4"/><text x="330" y="809.025" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#111">End</text><polyline points="330,86 330,115" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="330,165 330,195" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="330,245 330,270" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="330,354 330,385" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="330,435 330,465" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="330,515 330,545" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="330,595 330,625" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="330,675 330,705" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="330,755 330,788" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="337.495" y="353.75" width="25.01" height="16.5" fill="#fff" fill-opacity="0.92"/><text x="350" y="365.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">Yes</text><polyline points="445,312 600,312 600,220 465,220" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="573.32" y="245.25" width="53.36" height="41.5" fill="#fff" fill-opacity="0.92"/><text x="600" y="256.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">No: try</text><text x="600" y="269.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">the next</text><text x="600" y="283.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#222">tanod</text><rect x="680" y="116" width="300" height="48" rx="4" fill="#fff4e0" stroke="#c98a1b" stroke-width="1.1"/><text x="830" y="130.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Entry depends on one person&#x27;s</text><text x="830" y="143.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">handwriting and on the book being at</text><text x="830" y="157.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">hand</text><line x1="465" y1="140" x2="680" y2="140" stroke="#c98a1b" stroke-width="1.0" stroke-dasharray="4 3"/><rect x="680" y="386" width="300" height="48" rx="4" fill="#fff4e0" stroke="#c98a1b" stroke-width="1.1"/><text x="830" y="413.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">No live location or status of any tanod</text><line x1="465" y1="410" x2="680" y2="410" stroke="#c98a1b" stroke-width="1.0" stroke-dasharray="4 3"/><rect x="680" y="546" width="300" height="48" rx="4" fill="#fff4e0" stroke="#c98a1b" stroke-width="1.1"/><text x="830" y="566.925" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Pages can be lost, damaged or illegible;</text><text x="830" y="580.425" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">no search</text><line x1="465" y1="570" x2="680" y2="570" stroke="#c98a1b" stroke-width="1.0" stroke-dasharray="4 3"/><rect x="680" y="626" width="300" height="48" rx="4" fill="#fff4e0" stroke="#c98a1b" stroke-width="1.1"/><text x="830" y="653.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Reports are rebuilt by hand every month</text><line x1="465" y1="650" x2="680" y2="650" stroke="#c98a1b" stroke-width="1.0" stroke-dasharray="4 3"/><rect x="680" y="238" width="300" height="48" rx="4" fill="#fff4e0" stroke="#c98a1b" stroke-width="1.1"/><text x="830" y="252.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">Dispatch takes several calls; an</text><text x="830" y="265.675" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">unreachable tanod is found out only</text><text x="830" y="279.175" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111">after trying</text><line x1="600" y1="262" x2="680" y2="262" stroke="#c98a1b" stroke-width="1.0" stroke-dasharray="4 3"/><text x="500" y="856" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444" font-style="italic">Shaded notes mark the weak points that the requirements in Table 4-2 address.</text></svg>