<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#111"/></marker></defs><rect width="760" height="470" fill="#fff"/><text x="380" y="26" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Situational awareness in Baranguard (after Endsley, 1995)</text><rect x="40" y="48" width="680" height="118" rx="6" fill="#e8f0fe" stroke="#111" stroke-width="1.4"/><text x="60" y="72" font-size="14" text-anchor="start" font-weight="bold" fill="#111">Level 1  Perception</text><text x="60" y="90" font-size="11.5" text-anchor="start" font-weight="normal" fill="#444" font-style="italic">What is happening, and where</text><text x="0" y="4.199999999999999" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"></text><text x="70" y="112" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Incident reports logged by staff (walk-in, phone, Facebook, SMS) and by tanods in</text><text x="70" y="127" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">the field</text><text x="0" y="4.199999999999999" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"></text><text x="70" y="142" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Responder positions from phone GPS, duty status and shift roster</text><text x="0" y="4.199999999999999" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"></text><text x="70" y="157" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• SOS alerts, by data or by encrypted SMS when broadband fails</text><line x1="380" y1="166" x2="380" y2="188" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="188" width="680" height="118" rx="6" fill="#e6f4ea" stroke="#111" stroke-width="1.4"/><text x="60" y="212" font-size="14" text-anchor="start" font-weight="bold" fill="#111">Level 2  Comprehension</text><text x="60" y="230" font-size="11.5" text-anchor="start" font-weight="normal" fill="#444" font-style="italic">What it means for the dispatcher</text><text x="0" y="4.199999999999999" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"></text><text x="70" y="252" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Dispatch Center queue: pending, reopened and dispatched incidents with priority</text><text x="0" y="4.199999999999999" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"></text><text x="70" y="267" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Live map of tanods, incidents, SOS and landmarks; incident detail and timeline</text><text x="0" y="4.199999999999999" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"></text><text x="70" y="282" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Counts, badges and Service Health so a missing source is visible, not hidden</text><line x1="380" y1="306" x2="380" y2="328" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="328" width="680" height="104" rx="6" fill="#fef7e0" stroke="#111" stroke-width="1.4"/><text x="60" y="352" font-size="14" text-anchor="start" font-weight="bold" fill="#111">Level 3  Projection</text><text x="60" y="370" font-size="11.5" text-anchor="start" font-weight="normal" fill="#444" font-style="italic">What may happen next (human judgement)</text><text x="0" y="4.199999999999999" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"></text><text x="70" y="392" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Historical heatmaps and statistical reports by period, type and barangay</text><text x="0" y="4.199999999999999" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"></text><text x="70" y="407" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">• Officials read the trends and decide patrols and resources; the system makes no</text><text x="70" y="422" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">forecast</text></svg>